# ---------------------------------------------------------------------------
# GitHub Pages deployment workflow — STAGED, NOT ACTIVE.
#
# This lives here rather than in .github/workflows/ because the session that
# wrote it had no permission to push workflow files (GitHub requires the
# `workflow` OAuth scope, which automation tokens are usually not granted).
#
# To activate, from a clone where you can push:
#
#     mkdir -p .github/workflows
#     git mv docs/pages-workflow.yml .github/workflows/pages.yml
#     git commit -m "Enable GitHub Pages deployment"
#     git push
#
# Then, once, in the repository:
#     Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#
# See docs/TESTING.md for what the deployed site can and cannot do.
# ---------------------------------------------------------------------------

name: Deploy demo to GitHub Pages

# GitHub Pages is static hosting: it can serve the React bundle, but there is
# no control server and no Asterisk behind it. The build published here runs in
# demo mode — the real interface driven by a simulation, with no audio — so the
# UI can be reviewed from a browser without standing anything up.
#
# The same bundle drives a real PBX when given one:
#   https://<user>.github.io/<repo>/?api=https://your-control-server
# which needs CORS_ORIGIN set on that server.

on:
  push:
    branches:
      - main
      - claude/softphone-application-0jdy1i
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        env:
          # Repository name, so assets resolve under /<repo>/.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DEMO: '1'
        run: npm run build

      - name: Add SPA fallback
        working-directory: web/dist
        # Pages has no rewrite rules; a 404.html copy of index.html means a
        # deep link or a refresh lands in the app rather than on GitHub's
        # error page.
        run: cp index.html 404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
