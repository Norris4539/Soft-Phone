[default]
mode = files
; Relative, so it resolves against whatever the build's data directory is
; (/usr/share/asterisk on Debian) — which is where the asterisk-moh-opsound-gsm
; package the Dockerfile installs puts its audio. If Asterisk logs "No music on
; hold classes configured", that package is missing, not this path.
directory = moh
; Shuffle so a caller who is held twice does not hear the same opening bar.
sort = random

; Queues use their own class so you can swap in company-branded audio without
; changing what a held one-to-one call hears.
[queue-hold]
mode = files
; Relative, so it resolves against whatever the build's data directory is
; (/usr/share/asterisk on Debian) — which is where the asterisk-moh-opsound-gsm
; package the Dockerfile installs puts its audio. If Asterisk logs "No music on
; hold classes configured", that package is missing, not this path.
directory = moh
sort = random
