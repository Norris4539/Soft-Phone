[general]
rtpstart = ${RTP_START}
rtpend = ${RTP_END}

; ICE is what lets the browser leg traverse NAT.  Asterisk acts as an ICE
; agent and offers its own candidates.
icesupport = yes

; Deliberately no `stunaddr`.
;
; Asterisk learns its public address from external_media_address in
; pjsip.conf, which is set from PUBLIC_HOSTNAME and is authoritative.  Adding
; a STUN lookup on top would either duplicate that or — if pointed at the
; bundled coturn, which sits on the same Docker network — return the
; container's own private address and overwrite the correct one with a
; useless one.
;
; The browsers are a different matter: they get STUN and TURN servers from
; /api/config and genuinely need them, because nobody knows in advance what
; is between an employee's laptop and this server.

; Keep the media path open through stateful firewalls that drop idle UDP.
rtpkeepalive = 15

; Hang up a channel whose media has gone silent.  A browser tab closed without
; a BYE would otherwise hold the channel — and a trunk line — indefinitely.
rtptimeout = 60
rtpholdtimeout = 300
