[general]
enabled = yes
; Pretty-printing costs nothing at this scale and makes `curl` debugging of the
; live-state endpoints readable.
pretty = yes
; Events the control server subscribes to are delivered over the ARI
; WebSocket; allow a generous message size for channel/bridge snapshots.
websocket_write_timeout = 500

[${ARI_USERNAME}]
type = user
read_only = no
password = ${ARI_PASSWORD}
password_format = plain
