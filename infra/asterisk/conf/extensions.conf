; ---------------------------------------------------------------------------
; The switchboard.
;
;   trunk ──► [from-trunk] ──► [switchboard-inbound] ──► IVR / ring group /
;                                                        queue / voicemail
;   browser ──► [internal] ──► extension, feature code, or [outbound] ──► trunk
;
; Per-user hints and ring groups are appended to [internal] and [ring-groups]
; by extensions_users.conf, generated from config/users.json.
; ---------------------------------------------------------------------------

[globals]
MAIN_DID = ${MAIN_DID}
MAIN_CALLER_ID_NAME = ${MAIN_CALLER_ID_NAME}
TRUNK = PJSIP/${TRUNK_NAME}
; "no" when TRUNK_ENABLED=false, so an outbound attempt gets a spoken error
; instead of dialling an endpoint that does not exist.
TRUNK_CONFIGURED = ${TRUNK_CONFIGURED}
STASIS_APP = ${ARI_APP}
; How long an extension rings before the call moves on (voicemail, next step
; in a ring group, back to the queue).
RING_TIMEOUT = 25
; Where a call goes when nobody in particular is being asked for.
OPERATOR = ${OPERATOR_EXTENSION}
; Opt-in.  The IVR needs recorded prompts; until you have them, inbound calls
; go straight to the reception ring group, which needs none.
; See docs/DIALPLAN.md and scripts/generate-prompts.sh.
IVR_ENABLED = ${IVR_ENABLED}
; GotoIfTime syntax: <times>,<days-of-week>,<days-of-month>,<months>
OFFICE_HOURS = ${OFFICE_HOURS}

[general]
static = yes
writeprotect = no
; Extensions typed at a phone are matched in the context the endpoint is in,
; never globally.
autofallthrough = yes
clearglobalvars = no

; ===========================================================================
; INBOUND
; ===========================================================================

; Everything the provider sends us lands here.  Keep this context tiny: its
; job is only to normalise and hand off, because anything reachable from the
; trunk is reachable by the whole internet.
[from-trunk]
; Calls to the company's main number.
exten => ${MAIN_DID},1,NoOp(Inbound to main DID from ${CALLERID(num)})
 same => n,Goto(switchboard-inbound,s,1)

; Providers vary in how they present the DID — some send E.164 with a leading
; '+', some send the national format.  Accept the common shapes rather than
; making the operator guess which one their carrier uses.
exten => +${MAIN_DID},1,Goto(${MAIN_DID},1)
exten => s,1,Goto(${MAIN_DID},1)

; Direct inward dial straight to an extension, if the carrier delivers DIDs
; that map to one.  Configure the mapping in config/users.json ("did" field).
exten => _1XX,1,NoOp(Inbound DID direct to extension ${EXTEN})
 same => n,Goto(switchboard-inbound,direct-${EXTEN},1)

; Anything else addressed to us is either a misrouted call or a scan.  Reject
; it rather than falling through to a context that can place calls.
;
; `_X.` rather than the bare `_.`: a lone dot also matches Asterisk's own
; special extensions (i, t, h, s...), which means a hangup or a timeout would
; land here instead of where it belongs.
exten => _X.,1,NoOp(Unrouted inbound to ${EXTEN} from ${CALLERID(num)})
 same => n,Hangup(1)
exten => _[+*#].,1,Goto(_X.,1)

[switchboard-inbound]
exten => s,1,NoOp(Switchboard: ${CALLERID(all)} -> main line)
 same => n,Set(CDR(userfield)=inbound-main)
 same => n,Set(__FROM_TRUNK=1)
 ; Answering before routing means the caller hears ringback we control, and
 ; the media path is up before any prompt plays.
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,GotoIfTime(${OFFICE_HOURS}?open,1:closed,1)

exten => open,1,NoOp(Within office hours)
 same => n,GotoIf($["${IVR_ENABLED}" = "true"]?ivr-main,s,1)
 same => n,Goto(ring-groups,reception,1)

exten => closed,1,NoOp(Outside office hours)
 same => n,Playback(vm-goodbye)
 ; After hours the main line takes a message rather than ringing an empty
 ; office.  The operator's mailbox is the company mailbox.
 same => n,Voicemail(${OPERATOR}@switchboard,u)
 same => n,Hangup()

; Direct-to-extension inbound.  Generated per user so that an unknown DID
; cannot address an arbitrary extension.
#include extensions_did.conf

; ---------------------------------------------------------------------------
; IVR
; ---------------------------------------------------------------------------
; Every priority of `s` is kept in one unbroken block.  Splitting it and
; resuming with `exten => s,n,...` further down relies on Asterisk's
; last-priority bookkeeping surviving the other extensions in between, which
; is exactly the kind of thing that breaks quietly.
;
; The menu is single-digit only.  Offering both "press 1" and "dial extension
; 1XX" in the same context would make Asterisk wait for two more digits after
; the caller presses 1, and to the caller that is indistinguishable from the
; menu being broken.  Dial-by-extension lives behind option 3 instead.
[ivr-main]
exten => s,1,Set(ATTEMPT=0)
 same => n(menu),Set(ATTEMPT=$[${ATTEMPT} + 1])
 same => n,GotoIf($[${ATTEMPT} > 3]?operator)
 ; Background plays the prompt but keeps listening, so a caller who knows the
 ; menu can dial through it without waiting for the recording to finish.
 same => n,Background(custom/ivr-main)
 same => n,WaitExten(5)
 same => n,Goto(menu)
 same => n(operator),NoOp(IVR -> operator)
 same => n,Goto(ring-groups,reception,1)

exten => 1,1,NoOp(IVR -> sales)
 same => n,Goto(queues,sales,1)

exten => 2,1,NoOp(IVR -> support)
 same => n,Goto(queues,support,1)

exten => 3,1,NoOp(IVR -> dial by extension)
 same => n,Goto(ivr-extension,s,1)

exten => 0,1,Goto(s,operator)

exten => i,1,Playback(pbx-invalid)
 same => n,Goto(s,menu)
exten => t,1,Goto(s,menu)

[ivr-extension]
exten => s,1,Playback(vm-extension)
 same => n,WaitExten(6)
exten => _1XX,1,Goto(internal-dial,${EXTEN},1)
exten => i,1,Playback(pbx-invalid)
 same => n,Goto(s,1)
exten => t,1,Goto(ivr-main,s,operator)

; ---------------------------------------------------------------------------
; Ring groups and queues
; ---------------------------------------------------------------------------
; [ring-groups] is opened here and extended by extensions_users.conf so that
; the fallback below stays in one place regardless of how many groups exist.
[ring-groups]
; Shared tail: every ring group jumps here when nobody picks up.
exten => no-answer,1,NoOp(Ring group unanswered -> voicemail)
 same => n,Voicemail(${OPERATOR}@switchboard,u)
 same => n,Hangup()

; The generated file appends to both [ring-groups] and [internal], so it is
; included at the very bottom — [internal] does not exist yet at this point,
; and appending to a context before it is declared is an error.

[queues]
exten => sales,1,NoOp(Queue: sales)
 same => n,Set(CDR(userfield)=queue-sales)
 same => n,Queue(sales,tTc,,,300)
 same => n,Goto(overflow,1)

exten => support,1,NoOp(Queue: support)
 same => n,Set(CDR(userfield)=queue-support)
 same => n,Queue(support,tTc,,,300)
 same => n,Goto(overflow,1)

; Waited out the queue timeout with no agent available.
exten => overflow,1,NoOp(Queue overflow -> voicemail)
 same => n,Playback(vm-sorry)
 same => n,Voicemail(${OPERATOR}@switchboard,u)
 same => n,Hangup()

; ===========================================================================
; INTERNAL — what a logged-in softphone can dial
; ===========================================================================
[internal]
; --- Extension to extension ---
exten => _1XX,1,Goto(internal-dial,${EXTEN},1)

; --- Feature codes ---
; Voicemail: *97 checks your own mailbox, *98 asks which mailbox.
exten => *97,1,VoiceMailMain(${CALLERID(num)}@switchboard)
 same => n,Hangup()
exten => *98,1,VoiceMailMain(@switchboard)
 same => n,Hangup()

; Directed and group call pickup.
exten => *8,1,PickupChan(PJSIP/${OPERATOR})
 same => n,Hangup()
exten => _*8XXX,1,PickupChan(PJSIP/${EXTEN:2})
 same => n,Hangup()

; Leave a voicemail for someone without ringing them.
exten => _*XXX,1,NoOp(Direct to voicemail for ${EXTEN:1})
 same => n,Voicemail(${EXTEN:1}@switchboard,su)
 same => n,Hangup()

; Queue agent login / logout, so an agent can step away without going offline.
exten => *45,1,NoOp(Toggle queue membership for ${CALLERID(num)})
 same => n,Set(QSTATE=${QUEUE_MEMBER(sales,paused,PJSIP/${CALLERID(num)})})
 same => n,GotoIf($["${QSTATE}" = "1"]?unpause:pause)
 same => n(pause),PauseQueueMember(,PJSIP/${CALLERID(num)})
 same => n,Playback(vm-goodbye)
 same => n,Hangup()
 same => n(unpause),UnpauseQueueMember(,PJSIP/${CALLERID(num)})
 same => n,Playback(vm-review)
 same => n,Hangup()

; Reach the operator / reception from any handset.
exten => 0,1,Goto(ring-groups,reception,1)

; --- Diagnostics ---
; Echo test: proves the browser's microphone, the DTLS-SRTP path and the
; jitter buffer are all working before you blame the trunk.
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()
; Read back what Asterisk thinks your caller ID is.
exten => 601,1,Answer()
 same => n,SayDigits(${CALLERID(num)})
 same => n,Hangup()
; Hand the channel to the ARI application — used by the dashboard's
; "monitor this call" action and available for future call-control features.
exten => 602,1,Answer()
 same => n,Stasis(${STASIS_APP})
 same => n,Hangup()

; --- Outbound ---
; An explicit 9 prefix, for sites that want the classic "dial 9 for an outside
; line" habit, plus bare E.164 for anyone who just pastes a number.
exten => _9X.,1,Goto(outbound,${EXTEN:1},1)
exten => _+X.,1,Goto(outbound,${EXTEN},1)
exten => _NXXNXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _1NXXNXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _00X.,1,Goto(outbound,${EXTEN},1)

exten => i,1,Playback(pbx-invalid)
 same => n,Hangup()
exten => t,1,Hangup()

; ---------------------------------------------------------------------------
; Dialling an extension, in one place so ring groups, the IVR and direct
; extension-to-extension calls all behave identically.
; ---------------------------------------------------------------------------
[internal-dial]
exten => _1XX,1,NoOp(Dial extension ${EXTEN})
 ; Dialling an extension that was never provisioned should say so, not ring
 ; into silence for 25 seconds.
 same => n,GotoIf($["${DEVICE_STATE(PJSIP/${EXTEN})}" = "INVALID"]?nosuch)
 same => n,Set(CALLERID(name)=${CALLERID(name)})
 ; t/T let either party transfer; the caller keeps their own ID internally.
 same => n,Dial(PJSIP/${EXTEN},${RING_TIMEOUT},tT)
 same => n,Goto(dial-result-${DIALSTATUS},1)

exten => nosuch,1,Playback(pbx-invalid)
 same => n,Hangup()

; Dial() outcomes worth distinguishing.  Anything not listed falls through to
; the catch-all below.
exten => dial-result-BUSY,1,Voicemail(${EXTEN}@switchboard,bu)
 same => n,Hangup()
exten => dial-result-NOANSWER,1,Voicemail(${EXTEN}@switchboard,u)
 same => n,Hangup()
exten => dial-result-CHANUNAVAIL,1,NoOp(Extension offline -> voicemail)
 same => n,Voicemail(${EXTEN}@switchboard,u)
 same => n,Hangup()
exten => dial-result-ANSWER,1,Hangup()
exten => _dial-result-X.,1,Hangup()
exten => _dial-result-[A-Z].,1,Hangup()

; ===========================================================================
; OUTBOUND
; ===========================================================================
[outbound]
; Reached only via [internal], so the caller is an authenticated extension.
; `_X.` and `_+X.` rather than a bare `_.`, which would also swallow the
; special i/t/h extensions.
exten => _+X.,1,Goto(_X.,1)
exten => _X.,1,NoOp(Outbound ${EXTEN} from extension ${CALLERID(num)})
 same => n,GotoIf($["${TRUNK_CONFIGURED}" = "no"]?notrunk)
 ; Present the company's main number unless this extension has been given its
 ; own outbound caller ID in config/users.json.
 same => n,Set(OUTBOUND_CID=${IF($[${LEN(${OUTBOUND_CID})} > 0]?${OUTBOUND_CID}:${MAIN_DID})})
 same => n,Set(CALLERID(num)=${OUTBOUND_CID})
 same => n,Set(CALLERID(name)=${MAIN_CALLER_ID_NAME})
 same => n,Set(CDR(userfield)=outbound-${CALLERID(num)})
 ; 60s to answer: long enough for a mobile to ring out, short enough that a
 ; forgotten call does not hold a trunk channel.
 same => n,Dial(${TRUNK}/${EXTEN},60,tT)
 same => n,Goto(after-dial,1)

exten => after-dial,1,NoOp(Outbound result ${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}" = "CONGESTION"]?congestion)
 same => n,Playback(vm-sorry)
 same => n,Hangup()
 same => n(busy),Busy(5)
 same => n(congestion),Congestion(5)
 same => n(done),Hangup()

exten => notrunk,1,NoOp(Outbound attempted with TRUNK_ENABLED=false)
 same => n,Answer()
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; ===========================================================================
; Generated per-user configuration.
;
; Last, because it appends to [internal] and [ring-groups] with the (+)
; syntax, and both must already exist.
; ===========================================================================
#include extensions_users.conf
