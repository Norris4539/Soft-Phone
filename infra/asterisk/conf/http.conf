[general]
enabled = yes
; Plain HTTP is bound to loopback-plus-container-network only: ARI and AMI are
; reached by the control server over the compose network, never from the
; internet.  Do not publish 8088 in docker-compose.
bindaddr = 0.0.0.0
bindport = 8088

; TLS listener — this is what browsers open the SIP WebSocket against
; (wss://host:8089/ws).  A browser will not connect to a certificate it does
; not trust, so in development you must accept the self-signed cert once by
; visiting https://localhost:8089/ws directly.
tlsenable = yes
tlsbindaddr = 0.0.0.0:8089
; Copied here from the read-only /etc/asterisk/keys mount by the entrypoint,
; because Asterisk reads these after dropping to the `asterisk` user.
tlscertfile = /var/lib/asterisk/keys/asterisk.pem
tlsprivatekey = /var/lib/asterisk/keys/asterisk.key

servername = Softphone Switchboard
sessionlimit = 200
session_inactivity = 30000
session_keep_alive = 15000
