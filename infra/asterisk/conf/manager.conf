[general]
enabled = yes
webenabled = no
; AMI is reachable only on the compose network — never publish 5038.
bindaddr = 0.0.0.0
port = 5038
displayconnects = no
timestampevents = yes

[${AMI_USERNAME}]
secret = ${AMI_PASSWORD}
; Restrict to the compose network.  Order matters and is the opposite of what
; reads naturally: Asterisk evaluates these top to bottom and the last match
; wins, so a trailing deny-all overrides every permit above it and nothing can
; log in.  Deny first, then carve out what is allowed.
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
permit = 10.0.0.0/255.0.0.0
; The compose network's pinned subnet lives in 172.16/12.
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
; The control server needs queue and device state, plus the ability to
; originate, hang up and redirect channels for the switchboard operator view.
read = system,call,agent,user,dtmf,reporting,cdr,dialplan
write = system,call,agent,user,originate,reporting
