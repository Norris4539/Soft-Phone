; ---------------------------------------------------------------------------
; PJSIP — transports, the provider trunk, and shared endpoint defaults.
;
; Rendered from a template at container start.  Per-user endpoints live in
; pjsip_endpoints.conf, generated from config/users.json by
; scripts/manage-users.mjs, and are included at the bottom of this file.
; ---------------------------------------------------------------------------

[global]
type = global
user_agent = Softphone Switchboard
; Browsers renegotiate on hold/unhold and some providers are slow to answer a
; re-INVITE; the default 32s timer is unnecessarily patient.
default_realm = ${ASTERISK_SIP_DOMAIN}
endpoint_identifier_order = username,ip,anonymous

; No [system] section: the transaction timers (timer_t1, timer_b) are left at
; their RFC 3261 defaults.  Shortening timer_b to fail over faster looks
; tempting, but Asterisk clamps anything below 32000 back up and warns at
; every boot, so the setting only produces noise.

; --- Transports ------------------------------------------------------------
; UDP/TCP face the provider trunk.  Browsers never touch these.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
${EXTERNAL_MEDIA_LINE}
${EXTERNAL_SIGNALING_LINE}
; RFC1918 space the container may see, so Asterisk knows which contacts are
; local and which need the external address rewritten into the SDP.
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16
local_net = 127.0.0.0/8

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060
${EXTERNAL_MEDIA_LINE}
${EXTERNAL_SIGNALING_LINE}
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16
local_net = 127.0.0.0/8

; Secure WebSocket for the browser softphones.  The listener itself is the
; HTTP server configured in http.conf on port 8089 — this section only tells
; PJSIP to accept SIP over it.
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0:5060
${EXTERNAL_MEDIA_LINE}
${EXTERNAL_SIGNALING_LINE}

; --- Endpoint templates ----------------------------------------------------
; Every browser extension inherits this.  The WebRTC settings are not
; individually optional: a browser will refuse the session if DTLS, ICE,
; rtcp-mux or AVPF is missing, so they travel together.
[webrtc-endpoint](!)
type = endpoint
context = internal
disallow = all
allow = opus
allow = ulaw
allow = alaw
webrtc = yes
dtls_auto_generate_cert = yes
; `webrtc = yes` implies the four settings below, but they are spelled out so
; that a future edit cannot silently drop one of them.
media_encryption = dtls
dtls_verify = fingerprint
ice_support = yes
use_avpf = yes
rtcp_mux = yes
media_use_received_transport = yes
; Browsers send DTMF as RFC2833 telephone-event.
dtmf_mode = rfc4733
; Presence: the dashboard subscribes to extension state through ARI, but the
; softphones also publish their own registration state.
allow_subscribe = yes
send_pai = yes
; Direct media is impossible with WebRTC — Asterisk must stay in the path to
; bridge DTLS-SRTP to the trunk's plain RTP.
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes
trust_id_inbound = yes
; Call recording / monitoring hooks used by the dashboard.
one_touch_recording = yes
record_on_feature = automixmon
record_off_feature = automixmon

[webrtc-aor](!)
type = aor
; Browsers reconnect on page reload, so allow a couple of concurrent contacts
; and expire them quickly once the WebSocket drops.
max_contacts = 3
remove_existing = yes
qualify_frequency = 30
default_expiration = 120
maximum_expiration = 300

[webrtc-auth](!)
type = auth
auth_type = userpass

;;TRUNK;;
; --- Provider trunk --------------------------------------------------------
[${TRUNK_NAME}]
type = endpoint
context = from-trunk
disallow = all
allow = ulaw
allow = alaw
allow = g722
; Most providers deliver DTMF as RFC2833.
dtmf_mode = rfc4733
; Uncommented only for TRUNK_AUTH=userpass.  An IP-authenticated trunk has no
; [<name>-auth] section, and pointing at one that does not exist makes the
; whole endpoint fail to load.
;;AUTHLINE;;outbound_auth = ${TRUNK_NAME}-auth
aors = ${TRUNK_NAME}
from_user = ${TRUNK_FROM_USER}
from_domain = ${TRUNK_FROM_DOMAIN}
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes
; The trunk carries plain RTP; DTLS lives only on the browser leg.
media_encryption = no
language = en

[${TRUNK_NAME}]
type = aor
contact = sip:${TRUNK_HOST}:${TRUNK_PORT}\;transport=${TRUNK_TRANSPORT}
qualify_frequency = 60

[${TRUNK_NAME}]
type = identify
endpoint = ${TRUNK_NAME}
match = ${TRUNK_HOST}

;;USERPASS;;
[${TRUNK_NAME}-auth]
type = auth
auth_type = userpass
username = ${TRUNK_USERNAME}
password = ${TRUNK_PASSWORD}

[${TRUNK_NAME}]
type = registration
transport = transport-${TRUNK_TRANSPORT}
outbound_auth = ${TRUNK_NAME}-auth
server_uri = sip:${TRUNK_HOST}:${TRUNK_PORT}
client_uri = sip:${TRUNK_USERNAME}@${TRUNK_HOST}:${TRUNK_PORT}
contact_user = ${TRUNK_USERNAME}
retry_interval = 60
forbidden_retry_interval = 600
expiration = 3600
line = yes
endpoint = ${TRUNK_NAME}
;;ENDUSERPASS;;

;;IPAUTH;;
; IP-authenticated trunk: the provider recognises us by source address, so
; there is no registration and no digest auth.  The [identify] section above
; is what lets inbound calls from the provider match this endpoint.
;;ENDIPAUTH;;
;;ENDTRUNK;;

; --- Per-user endpoints ----------------------------------------------------
#include pjsip_endpoints.conf
