[modules]
; Autoload, then subtract.  Naming modules to `load` explicitly looks safer
; but is not: module filenames differ between builds (Debian ships the Opus
; codec as codec_opus_open_source.so, not codec_opus.so), so an explicit list
; either fails to load or logs errors for modules that were going to load
; anyway.
autoload = yes

; --- Conflicting channel drivers ------------------------------------------
; chan_sip is the deprecated stack; everything here is PJSIP.  Loading both
; means two things bind port 5060 and the failure is baffling.
noload = chan_sip.so

; Channel drivers with no hardware or use case here.
noload = chan_mgcp.so
noload = chan_skinny.so
noload = chan_unistim.so
noload = chan_alsa.so
noload = chan_console.so

; --- Duplicate application providers --------------------------------------
; Three voicemail modules ship; loading more than one produces a stream of
; "Already have an application 'VoiceMail'" warnings at every boot.  The plain
; one is the one we want — the others need IMAP or ODBC backends.
noload = app_voicemail_imap.so
noload = app_voicemail_odbc.so

; --- Unused subsystems ----------------------------------------------------
; Alternative dialplan languages.  They each register a pile of example
; contexts that clutter `dialplan show` and are never called.
noload = pbx_lua.so
noload = pbx_ael.so

; DUNDi peer discovery: not used, and warns about a missing dundi.conf.
noload = pbx_dundi.so

; Geolocation (RFC 6442).  Not used, and Debian's shipped geolocation.conf
; fails to parse, which logs an error on every boot.  res_pjsip_geolocation
; must go with it — on its own it fails to link against the missing symbols.
noload = res_geolocation.so
noload = res_pjsip_geolocation.so

; Deprecated, and each one warns about its own removal at every boot.
noload = app_macro.so
noload = res_adsi.so
noload = app_adsiprog.so
noload = app_getcpeid.so

; --- Backends we do not have ----------------------------------------------
; Debian autoloads every driver it ships.  Each of these then fails to find
; its database or config and logs an error, which trains you to ignore errors
; in the boot log — the opposite of what you want from a phone system.
; Re-enable any of them if you actually add that backend.
noload = res_config_pgsql.so
noload = res_config_ldap.so
noload = res_config_sqlite3.so
noload = res_config_odbc.so
noload = cdr_pgsql.so
noload = cdr_odbc.so
noload = cdr_tds.so
noload = cdr_radius.so
noload = cdr_sqlite3_custom.so
noload = cel_pgsql.so
noload = cel_odbc.so
noload = cel_tds.so
noload = cel_radius.so
noload = cel_sqlite3_custom.so

; Homer/HEP packet capture and phone auto-provisioning: neither is configured.
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so
noload = res_phoneprov.so
noload = res_pjsip_phoneprov_provider.so
