[general]
format = wav49|gsm|wav
; Voicemail-to-email.  Asterisk shells out to the local MTA, which the
; container does not run, so this is off by default — set an SMTP relay in the
; container or forward the spool directory instead.  See docs/DEPLOYMENT.md.
attach = yes
maxmsg = 100
maxsecs = 300
; maxsilence must stay below minsecs. If silence detection can run longer than
; the minimum keep-length, a caller who says nothing leaves a saved message
; containing nothing, and somebody has to listen to it to find that out.
minsecs = 4
maxsilence = 3
silencethreshold = 128
skipms = 3000
maxlogins = 3
emaildateformat = %A, %B %d, %Y at %r
sendvoicemail = yes
serveremail = voicemail@localhost
emailsubject = [${MAIN_CALLER_ID_NAME}] New voicemail for ${VM_NAME}
emailbody = Hi ${VM_NAME},\n\nYou have a new ${VM_DUR} voicemail (number ${VM_MSGNUM}) from ${VM_CALLERID}, received ${VM_DATE}.\n\nThe recording is attached.\n

[zonemessages]
local = America/New_York|'vm-received' Q 'digits/at' IMp

; Mailboxes are generated from config/users.json.
#include voicemail_users.conf
