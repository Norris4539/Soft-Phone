; Deliberately no [directories] section.
;
; The compiled-in defaults are correct for whichever distribution build is in
; the image, and they are not the same everywhere: Debian uses
; /usr/lib/asterisk/modules while Ubuntu's multiarch build uses
; /usr/lib/x86_64-linux-gnu/asterisk/modules.  Hardcoding those paths here
; would break module loading entirely the first time the base image changed,
; and the failure ("no modules found") gives no hint as to why.
;
; Where things actually live on a Debian-family build, for reference:
;   sounds        /usr/share/asterisk/sounds/en
;   music on hold /var/lib/asterisk/moh    (named absolutely in musiconhold.conf)
;   spool         /var/spool/asterisk

[options]
runuser = asterisk
rungroup = asterisk
documentation_language = en_US
defaultlanguage = en
; Colour escape codes in a docker log are noise.
nocolor = yes
; Containers have no TTY to prompt at, and every start is a cold start.
verbose = 3
