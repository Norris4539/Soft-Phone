[general]
persistentmembers = yes
; Monitor per-call so the dashboard can offer a recording link.
monitor-type = MixMonitor
; Report agent pauses to AMI/ARI, which is how the dashboard shows who is
; actually taking calls versus merely logged in.
updatecdr = yes
shared_lastcall = yes

; Queue definitions (including their members) are generated from
; config/users.json by scripts/manage-users.mjs.
#include queues_members.conf
