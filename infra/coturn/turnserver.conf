# ---------------------------------------------------------------------------
# coturn — STUN and TURN for the browser softphones.
#
# STUN alone gets most users connected.  TURN is the fallback for the ones
# behind symmetric NAT or a firewall that blocks UDP entirely, which in
# practice is a meaningful share of corporate networks — so it is not optional
# for an internal company tool.
#
# realm, credentials and the port range are passed on the command line from
# docker-compose so they stay in .env with everything else.
# ---------------------------------------------------------------------------

listening-port=3478
fingerprint

# Long-term credentials.  For production, prefer the REST/ephemeral-credential
# mechanism (see docs/DEPLOYMENT.md) so a leaked page source does not hand out
# a permanent relay account.
lt-cred-mech

# Relay only for authenticated users, and never to addresses that would let
# someone use this server to reach the private network behind it.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

# The Asterisk container is the one private peer that must stay reachable, so
# that a relayed browser candidate can still send media to the PBX.  This is
# the compose network's pinned subnet (see `networks:` in docker-compose.yml);
# change both together.
allowed-peer-ip=172.28.0.0-172.28.255.255

# Quotas — a stray client should not be able to exhaust the relay.
user-quota=12
total-quota=200
max-bps=256000

no-cli
no-tlsv1
no-tlsv1_1
simple-log
log-file=stdout
verbose
