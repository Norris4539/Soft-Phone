server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app requests microphone access, which browsers only grant on a
    # secure origin.  http://localhost counts as secure; any other host must
    # be served over HTTPS (terminate TLS in front of this container).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry point, or a deploy leaves clients on old JS.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;

        # The live-state feed is a WebSocket; without these it degrades to a
        # request that hangs and then 502s.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A dashboard socket is idle whenever the switchboard is quiet; do not
        # cut it off for being well-behaved.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
